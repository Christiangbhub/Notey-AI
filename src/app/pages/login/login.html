<main
  class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-blue-100 via-blue-200 to-indigo-300"
>
  <section class="w-full max-w-md bg-white rounded-2xl shadow-xl p-6 sm:p-8">
    <header class="text-center mb-6">
      <h1 class="text-3xl font-bold text-slate-800">Welcome back</h1>
      <p class="mt-2 text-slate-500">Log in to continue to Notey-AI</p>
    </header>

    <form #loginForm="ngForm" (ngSubmit)="onLogin()" novalidate>
      <!-- Email -->
      <mat-form-field class="w-full">
        <mat-label>Email</mat-label>
        <mat-icon matPrefix>mail</mat-icon>
        <input
          matInput
          type="email"
          name="email"
          autocomplete="email"
          placeholder="name@example.com"
          [(ngModel)]="email"
          #emailCtrl="ngModel"
          required
          email
        />
        @if (emailCtrl.hasError('required')) {
          <mat-error>Email is required</mat-error>
        } @else if (emailCtrl.hasError('email')) {
          <mat-error>Enter a valid email address</mat-error>
        }
      </mat-form-field>

      <!-- Password -->
      <mat-form-field class="w-full">
        <mat-label>Password</mat-label>
        <mat-icon matPrefix>lock</mat-icon>
        <input
          matInput
          [type]="hide ? 'password' : 'text'"
          name="password"
          autocomplete="current-password"
          [(ngModel)]="password"
          #passwordCtrl="ngModel"
          required
        />
        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="hide = !hide"
          [attr.aria-label]="hide ? 'Show password' : 'Hide password'"
        >
          <mat-icon>{{ hide ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error>Password is required</mat-error>
      </mat-form-field>

      <div class="flex justify-end mb-4">
        <a routerLink="/password" class="text-sm text-blue-600 hover:underline">
          Forgot password?
        </a>
      </div>

      <button matButton="filled" type="submit" class="w-full" [disabled]="loginForm.invalid">
        Login
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-600">
      New here?
      <a routerLink="/newUser" class="font-medium text-blue-600 hover:underline">
        Create an account
      </a>
    </p>
  </section>
</main>
