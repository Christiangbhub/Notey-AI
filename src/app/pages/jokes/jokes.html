<app-navbar></app-navbar>

<main class="grid min-h-screen place-items-center bg-gradient-to-b from-blue-50 to-blue-200 p-4">
  <div class="w-full max-w-xl text-center">
    <div class="text-7xl sm:text-8xl" aria-hidden="true">🤣</div>
    <h1 class="mt-4 text-2xl font-bold text-slate-800">Random joke</h1>
    <p class="mt-1 text-slate-500">Press the button for a new one.</p>

    <button matButton="filled" class="mt-6" (click)="fetchJoke()" [disabled]="loading()">
      {{ joke() ? 'Another one!' : 'Get a joke' }}
    </button>

    @if (joke(); as j) {
      <mat-card class="mt-6">
        <mat-card-content class="p-4">
          <p class="text-lg text-slate-700">{{ j.setup }}</p>
          <p class="mt-3 text-lg font-semibold text-blue-700">{{ j.punchline }}</p>
        </mat-card-content>
      </mat-card>
    }
  </div>
</main>
